services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cafeteria
      POSTGRES_PASSWORD: cafeteria
      POSTGRES_DB: cafeteria
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cafeteria"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://cafeteria:cafeteria@db:5432/cafeteria
      JWT_SECRET: change-me-in-production
      CORS_ORIGINS: "*"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
